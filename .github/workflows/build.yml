name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  release:
    types: [ published ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev protobuf-compiler

      # rustup picks the toolchain from rust-toolchain.toml; make sure the extra components are present.
      - name: Install toolchain components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  # Runs on pushes to main only to keep the cargo cache warm: release-tag runs can restore caches created
  # on the default branch, but not caches created on other tags, so releases would otherwise always build cold.
  binaries:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libpq-dev gcc protobuf-compiler

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The job id is shared by both matrix entries; key the cache per target.
          key: ${{ matrix.target }}

      - name: Get binary name
        run: echo "BIN_NAME=$(grep -m1 '^name' dnsseeder/Cargo.toml | sed 's/name = "\(.*\)"/\1/')" >> $GITHUB_ENV

      - name: Build binary
        run: |
          RUSTFLAGS="-C target-feature=-crt-static -C link-args=-s" \
          cargo build --release --target ${{ matrix.target }}

      - name: Compress binary with arch suffix
        if: github.event_name == 'release'
        run: |
          BIN=target/${{ matrix.target }}/release/${{ env.BIN_NAME }}
          chmod 755 "$BIN"
          cp "$BIN" "${{ env.BIN_NAME }}-${{ matrix.arch }}"
          gzip -f "${{ env.BIN_NAME }}-${{ matrix.arch }}"

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.BIN_NAME }}-${{ matrix.arch }}.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
